<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">NISAは商品を入れる「税のしくみ」</title><desc id="d">NISAは価格下落を防ぐしくみではありません。対象・条件を公式情報で確認します。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">NISAは商品を入れる「税のしくみ」</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">NISA口座</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">税の制度</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">商品ではない</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">商品を選ぶ</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">株・投資信託</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">対象条件を確認</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">利益が出たら</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">制度の範囲で</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">非課税になる</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">値下がり</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">損失はありうる</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">元本保証ではない</text><text x="42" y="319" font-size="12" fill="#748077">NISAは価格下落を防ぐしくみではありません。対象・条件を公式情報で確認します。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">投資には値上がり・値下がりの両方がある</title><desc id="d">模式図です。実際の価格や将来の値動きを表していません。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">投資には値上がり・値下がりの両方がある</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">買う</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">投資した金額</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">例：1,000円</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">下がる</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">価格が変化</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">例：700円</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">売る</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">売却価格を確認</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">費用もかかる</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">結果</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">元本割れも</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">損失の可能性</text><text x="42" y="319" font-size="12" fill="#748077">模式図です。実際の価格や将来の値動きを表していません。</text></svg>
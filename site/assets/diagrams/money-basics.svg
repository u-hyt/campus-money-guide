<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">投資に回す前のお金の整理</title><desc id="d">生活費や近く使うお金を先に確保し、余裕のある範囲を考えます。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">投資に回す前のお金の整理</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">収入</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">アルバイトなど</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">入ってくるお金</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">支出</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">家賃・学費など</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">必要なお金</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">備え</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">急な出費</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">使う予定の資金</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">確認</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">余裕がある？</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">無理なら投資しない</text><text x="42" y="319" font-size="12" fill="#748077">生活費や近く使うお金を先に確保し、余裕のある範囲を考えます。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">大学生の家計と投資資金</title><desc id="d">学費・生活費など、近く使う予定のお金は投資資金と分けて考えます。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">大学生の家計と投資資金</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">収入</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">バイト・仕送り</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">奨学金の条件も確認</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">必要な支出</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">学費・家賃</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">食費・交通費</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">予備資金</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">急な出費</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">近い予定の費用</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">投資</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">余裕の範囲で</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">始めない選択も</text><text x="42" y="319" font-size="12" fill="#748077">学費・生活費など、近く使う予定のお金は投資資金と分けて考えます。</text></svg>
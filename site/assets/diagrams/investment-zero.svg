<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">株を買うと、どんなことが起きる？</title><desc id="d">株価は上下します。図はしくみを示したもので値動きの予測ではありません。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">株を買うと、どんなことが起きる？</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">お金を出す</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">株を買う</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">会社の持ち分</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">会社</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">活動に使う</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">事業を続ける</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">株価</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">買いたい人・売りたい人</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">状況で変わる</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">結果</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">値上がりも</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">値下がりも</text><text x="42" y="319" font-size="12" fill="#748077">株価は上下します。図はしくみを示したもので値動きの予測ではありません。</text></svg>
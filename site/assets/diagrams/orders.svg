<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">注文方法の違いを比べる</title><desc id="d">どちらも成立や希望どおりの価格を保証しません。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">注文方法の違いを比べる</text><rect x="45" y="100" width="415" height="170" rx="15" fill="#eef5ed"/><text x="252" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#527a61">成行注文</text><text x="252" y="183" text-anchor="middle" font-size="20" font-weight="700" fill="#27352f">価格を指定しない</text><text x="252" y="220" text-anchor="middle" font-size="14" fill="#67756d">成立価格が想定外も</text><rect x="500" y="100" width="415" height="170" rx="15" fill="#f8f1e3"/><text x="707" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#a18249">指値注文</text><text x="707" y="183" text-anchor="middle" font-size="20" font-weight="700" fill="#27352f">価格を指定する</text><text x="707" y="220" text-anchor="middle" font-size="14" fill="#67756d">成立しない場合も</text><text x="42" y="319" font-size="12" fill="#748077">どちらも成立や希望どおりの価格を保証しません。</text></svg>
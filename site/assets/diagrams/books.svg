<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">投資を学ぶ本・情報の選び方</title><desc id="d">特定の商品を勧めず、学び方を確認するための図です。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">投資を学ぶ本・情報の選び方</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">発行年</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">制度は変わる</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">新しさを確認</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">出典</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">誰が書いた？</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">公式資料を探す</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">説明</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">リスク・費用</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">両方書かれている？</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">照合</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">公的情報と</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">見比べて学ぶ</text><text x="42" y="319" font-size="12" fill="#748077">特定の商品を勧めず、学び方を確認するための図です。</text></svg>
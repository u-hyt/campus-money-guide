<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">口座開設までの準備</title><desc id="d">口座を作ったあと、すぐに商品を買う必要はありません。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">口座開設までの準備</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">家計</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">使う予定を整理</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">投資額を考える</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">比較</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">取扱商品・費用</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">サポートも確認</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">申込み</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">本人確認書類</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">条件を確認</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">開設後</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">画面とルール</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">学んでから判断</text><text x="42" y="319" font-size="12" fill="#748077">口座を作ったあと、すぐに商品を買う必要はありません。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">投資信託のお金の流れ</title><desc id="d">投資先が分かれていても、市場全体の下落などで損失が出ることがあります。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">投資信託のお金の流れ</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">投資家</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">お金を出す</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">複数の人から</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">投資信託</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">お金をまとめる</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">方針を決める</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">投資先</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">株・債券など</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">商品ごとに異なる</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">結果</text><text x="834" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">価格が変わる</text><text x="834" y="218" text-anchor="middle" font-size="13" fill="#67756d">費用・損失も</text><text x="42" y="319" font-size="12" fill="#748077">投資先が分かれていても、市場全体の下落などで損失が出ることがあります。</text></svg>
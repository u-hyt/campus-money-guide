<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d" font-family="sans-serif"><title id="t">資産形成でよく聞く3つの考え方</title><desc id="d">長期・積立・分散は損失をなくす方法ではなく、結果を保証しません。</desc><rect width="960" height="350" rx="20" fill="#fbfcfa"/><text x="40" y="56" font-size="23" font-weight="700" fill="#27352f">資産形成でよく聞く3つの考え方</text><rect x="25" y="100" width="190" height="170" rx="15" fill="#eef5ed"/><text x="120" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">長期</text><text x="120" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">時間をかけて</text><text x="120" y="218" text-anchor="middle" font-size="13" fill="#67756d">続ける考え方</text><path d="M223 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="263" y="100" width="190" height="170" rx="15" fill="#f8f1e3"/><text x="358" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">積立</text><text x="358" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">時期を分けて</text><text x="358" y="218" text-anchor="middle" font-size="13" fill="#67756d">買う方法</text><path d="M461 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="501" y="100" width="190" height="170" rx="15" fill="#eff0f8"/><text x="596" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">分散</text><text x="596" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#27352f">投資先を分け</text><text x="596" y="218" text-anchor="middle" font-size="13" fill="#67756d">偏りを抑える</text><path d="M699 184h30m-9-8 9 8-9 8" fill="none" stroke="#91a895" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="739" y="100" width="190" height="170" rx="15" fill="#f8ece5"/><text x="834" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#78927b">確認</text><text x=